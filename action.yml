name: 'Cloudflare Workers Deploy'
description: 'Deploy preview and production environments to Cloudflare Workers'
author: 'w3dev'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  cloudflare_api_token:
    description: 'Cloudflare API token with Workers edit permission'
    required: true
  cloudflare_account_id:
    description: 'Cloudflare Account ID'
    required: true
  teardown:
    description: 'Delete the named Worker Preview when a PR closes'
    required: false
    default: 'false'
  package_manager:
    description: 'Package manager to use (bun, npm, pnpm)'
    required: false
    default: 'bun'
  node_version:
    description: 'Node.js version'
    required: false
    default: '22'
  working_directory:
    description: 'Working directory for the build'
    required: false
    default: '.'
  alias_prefix:
    description: 'Prefix for an automatically derived pull request preview name'
    required: false
    default: ''
  preview_name:
    description: 'Explicit Worker Preview name. Required for non-PR preview runs.'
    required: false
    default: ''
  prebuild_script:
    description: 'Optional script to run before deployment (e.g., configure git author, run codegen)'
    required: false
    default: ''
  install_command:
    description: 'Custom install command (overrides package_manager default)'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for PR comments'
    required: false
    default: ${{ github.token }}
  environment:
    description: 'Deployment environment (preview or production)'
    required: false
    default: 'preview'
  predeploy_script:
    description: 'Optional script to run before deployment'
    required: false
    default: ''
  wrangler_version:
    description: 'Wrangler CLI version (must be 4.135.0 or newer for previews)'
    required: false
    default: '4.135.0'
  pnpm_version:
    description: 'pnpm version to install. Leave empty to use the `packageManager` field from package.json (recommended).'
    required: false
    default: ''

outputs:
  deployment_url:
    description: 'Stable Worker Preview URL, or the production workers.dev URL when one is emitted'
    value: ${{ steps.deploy.outputs.deployment_url }}
  preview_url:
    description: 'Stable Worker Preview URL (the latest deployment for the named Preview)'
    value: ${{ steps.deploy.outputs.preview_url }}
  version_url:
    description: 'Unique URL for the current Preview deployment (v1 compatibility name)'
    value: ${{ steps.deploy.outputs.version_url }}
  version_id:
    description: 'Current Preview deployment ID (v1 compatibility name)'
    value: ${{ steps.deploy.outputs.version_id }}
  preview_name:
    description: 'The resolved Worker Preview name'
    value: ${{ steps.context.outputs.preview_name }}
  preview_id:
    description: 'The Worker Preview resource ID'
    value: ${{ steps.deploy.outputs.preview_id }}
  deployment_id:
    description: 'The current Preview deployment resource ID'
    value: ${{ steps.deploy.outputs.deployment_id }}
  preview_urls:
    description: 'JSON array of all stable Preview URLs'
    value: ${{ steps.deploy.outputs.preview_urls }}
  deployment_urls:
    description: 'JSON array of all unique Preview deployment URLs'
    value: ${{ steps.deploy.outputs.deployment_urls }}
  pr_number:
    description: 'The PR number (if applicable)'
    value: ${{ steps.context.outputs.pr_number }}

runs:
  using: 'composite'
  steps:
    - name: Determine context
      id: context
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        TEARDOWN: ${{ inputs.teardown }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        PREVIEW_NAME: ${{ inputs.preview_name }}
        ALIAS_PREFIX: ${{ inputs.alias_prefix }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/scripts/resolve-context.sh"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Verify Node.js version
      shell: bash
      env:
        REQUIRED_NODE_MAJOR: '22'
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/check-node-version.sh"

    - name: Setup Bun
      if: inputs.package_manager == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup pnpm
      if: inputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm_version }}

    - name: Install dependencies
      if: inputs.teardown != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        INSTALL_CMD: ${{ inputs.install_command }}
        PKG_MANAGER: ${{ inputs.package_manager }}
      run: |
        case "$PKG_MANAGER" in
          bun) default_install=(bun install) ;;
          npm) default_install=(npm ci) ;;
          pnpm) default_install=(pnpm install) ;;
          *) echo "Unsupported package_manager: $PKG_MANAGER" >&2; exit 1 ;;
        esac

        if [ -n "$INSTALL_CMD" ]; then
          bash -euo pipefail -c "$INSTALL_CMD"
        else
          "${default_install[@]}"
        fi

    - name: Install Wrangler CLI
      shell: bash
      env:
        PKG_MANAGER: ${{ inputs.package_manager }}
        WRANGLER_VERSION: ${{ inputs.wrangler_version }}
      run: |
        case "$PKG_MANAGER" in
          bun|npm|pnpm) ;;
          *) echo "Unsupported package_manager: $PKG_MANAGER" >&2; exit 1 ;;
        esac

        if [ "$WRANGLER_VERSION" == "latest" ]; then
          PACKAGE="wrangler"
        else
          PACKAGE="wrangler@$WRANGLER_VERSION"
        fi

        if [ "$PKG_MANAGER" == "bun" ]; then
          bun install -g "$PACKAGE"
        elif [ "$PKG_MANAGER" == "pnpm" ]; then
          pnpm install -g "$PACKAGE"
        else
          npm install -g "$PACKAGE"
        fi

    - name: Verify Wrangler version
      shell: bash
      env:
        REQUIRED_WRANGLER_VERSION: '4.135.0'
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/check-wrangler-version.sh"

    - name: Run prebuild script
      if: inputs.prebuild_script != '' && inputs.teardown != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PREBUILD_SCRIPT: ${{ inputs.prebuild_script }}
      run: bash -euo pipefail -c "$PREBUILD_SCRIPT"

    - name: Run predeploy script
      if: inputs.predeploy_script != '' && inputs.teardown != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PREDEPLOY_SCRIPT: ${{ inputs.predeploy_script }}
      run: bash -euo pipefail -c "$PREDEPLOY_SCRIPT"

    - name: Deploy to Cloudflare Workers
      id: deploy
      if: inputs.teardown != 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        ENVIRONMENT: ${{ inputs.environment }}
        TEARDOWN: ${{ inputs.teardown }}
        PREVIEW_NAME: ${{ steps.context.outputs.preview_name }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/scripts/deploy.sh"

    - name: Delete Worker Preview
      if: inputs.teardown == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        ENVIRONMENT: ${{ inputs.environment }}
        TEARDOWN: ${{ inputs.teardown }}
        PREVIEW_NAME: ${{ steps.context.outputs.preview_name }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/scripts/deploy.sh"

    - name: Remove Preview PR comment
      if: steps.context.outputs.pr_number != '' && inputs.environment != 'production' && inputs.teardown == 'true'
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        PREVIEW_NAME: ${{ steps.context.outputs.preview_name }}
        WORKING_DIR: ${{ inputs.working_directory }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const prNumber = parseInt(process.env.PR_NUMBER);
          const previewName = process.env.PREVIEW_NAME;
          const workingDir = process.env.WORKING_DIR || '.';
          const marker = `<!-- cloudflare-workers-preview-${workingDir}-${previewName} -->`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100
          });
          const existingComment = comments.find(comment =>
            comment.user.login === 'github-actions[bot]' &&
            comment.body.includes(marker)
          );
          if (existingComment) {
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id
            });
          }

    - name: Add deployment summary
      if: inputs.teardown != 'true'
      shell: bash
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        PREVIEW_NAME: ${{ steps.context.outputs.preview_name }}
        PREVIEW_ID: ${{ steps.deploy.outputs.preview_id }}
        DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        COMMIT_SHA: ${{ github.sha }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ "$ENVIRONMENT" == "production" ]; then
          echo "## Cloudflare Workers Production Deployed" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Cloudflare Workers Preview Deployed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        if [ "$ENVIRONMENT" == "production" ]; then
          echo "| **Deployment URL** | ${DEPLOYMENT_URL:-Not emitted (route-based Worker)} |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| **Preview name** | `$PREVIEW_NAME` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | ${PREVIEW_URL:-Not emitted; check preview_urls and Wrangler config} |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -n "$VERSION_URL" ] && [ "$VERSION_URL" != "$DEPLOYMENT_URL" ]; then
          echo "| **Unique Deployment URL** | $VERSION_URL |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -n "$VERSION_ID" ]; then
          echo "| **Deployment ID** | \`$VERSION_ID\` |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -n "$PREVIEW_ID" ]; then
          echo "| **Preview ID** | \`$PREVIEW_ID\` |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "| **Commit** | \`$COMMIT_SHA\` |" >> $GITHUB_STEP_SUMMARY

    - name: Comment on PR
      if: steps.context.outputs.pr_number != '' && inputs.environment != 'production' && inputs.teardown != 'true'
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        PREVIEW_NAME: ${{ steps.context.outputs.preview_name }}
        PREVIEW_ID: ${{ steps.deploy.outputs.preview_id }}
        DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        COMMIT_SHA: ${{ github.sha }}
        WORKING_DIR: ${{ inputs.working_directory }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const prNumber = parseInt(process.env.PR_NUMBER);
          const deploymentUrl = process.env.DEPLOYMENT_URL;
          const previewUrl = process.env.PREVIEW_URL;
          const versionUrl = process.env.VERSION_URL;
          const versionId = process.env.VERSION_ID;
          const previewName = process.env.PREVIEW_NAME;
          const previewId = process.env.PREVIEW_ID;
          const deploymentId = process.env.DEPLOYMENT_ID;
          const commitSha = process.env.COMMIT_SHA;
          const workingDir = process.env.WORKING_DIR || '.';
          const marker = `<!-- cloudflare-workers-preview-${workingDir}-${previewName} -->`;
          const primaryUrl = previewUrl || deploymentUrl || 'No URL returned; check the Worker Preview configuration.';

          let commentBody = `${marker}

          **Cloudflare Workers Preview Deployed**

          | | |
          |---|---|
          | **Preview name** | \`${previewName}\` |
          | **Preview URL** | ${primaryUrl} |`;

          if (versionUrl && versionUrl !== deploymentUrl) {
            commentBody += `
          | **Unique Deployment URL** | ${versionUrl} |`;
          }

          if (previewId) {
            commentBody += `
          | **Preview ID** | \`${previewId}\` |`;
          }

          if (deploymentId || versionId) {
            commentBody += `
          | **Deployment ID** | \`${deploymentId || versionId}\` |`;
          }

          commentBody += `
          | **Commit** | \`${commitSha}\` |
          `;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100
          });

          const existingComment = comments.find(comment =>
            comment.user.login === 'github-actions[bot]' &&
            comment.body.includes(marker)
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
          }
