name: Validate action

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate metadata and scripts
        run: bash tests/validate_action.sh

      - name: Run mocked command tests
        run: bash tests/test_action.sh

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh tests/fixtures/wrangler

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate workflow syntax
        run: "$(go env GOPATH)/bin/actionlint"
